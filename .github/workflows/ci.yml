name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

# This job is pure validation (no external side effects), so a duplicate/stale run for the same
# ref is safe to cancel outright — unlike npm-publish.yml's queue-don't-cancel policy.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Verify pinned Rust toolchain
        shell: bash
        run: |
          rustc --version --verbose
          cargo --version --verbose
          rustc_release="$(rustc -vV)"
          grep '^release: 1.97.0$' >/dev/null <<<"$rustc_release"
      - name: Check for trailing whitespace across the tracked tree
        # Diffs the empty tree against the working tree so every tracked line is treated as an
        # addition and checked — a whole-repo invariant, not just the current PR's diff.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 -- .
      - name: Verify the Codex skill mirror is in sync
        run: node dev/sync-mirror.mjs --check
      - name: Validate docs, manifests, links, and fixtures
        run: node dev/validate-all.mjs
      - name: Compile fixture syntax
        run: |
          mkdir -p "$RUNNER_TEMP/rust-intel-fixtures"
          rustc --crate-type lib examples/fixtures/positive.rs -o "$RUNNER_TEMP/rust-intel-fixtures/positive.rlib"
          rustc --crate-type lib examples/fixtures/negative.rs -o "$RUNNER_TEMP/rust-intel-fixtures/negative.rlib"
      - name: Check JavaScript syntax
        run: |
          node --check bin/install.js
          node --check bin/install-codex.js
          node --check bin/install-transaction.js
          node --check dev/set-release-version.mjs
          node --check dev/check-release-version.mjs
          node --check dev/semver.mjs
          node --check dev/sync-mirror.mjs
          node --check dev/snapshot-install.mjs
          node --check dev/test-installer-recovery.mjs
          node --check dev/validate-all.mjs
          node --check skill/audit-project.workflow.js
      - name: Check shell installer syntax
        run: bash -n rust-cc-install.sh rust-cc-uninstall.sh
      - name: Smoke-test direct POSIX installer entry points and rollback
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          target="$root/target with spaces"
          mkdir -p "$target/skills/rust-intel" "$target/commands/rust-intel-cc"
          printf 'old-skill\n' > "$target/skills/rust-intel/SKILL.md"
          for path in rust-cc-audit.md rust-cc-fix.md rust-cc-plan.md; do printf 'old-%s\n' "$path" > "$target/commands/$path"; done
          printf 'old-namespace\n' > "$target/commands/rust-intel-cc/audit.md"
          for path in rust-audit.md rust-fix.md rust-plan.md rust-intel.md; do printf 'old-%s\n' "$path" > "$target/commands/$path"; done
          printf 'unrelated\n' > "$target/commands/keep.md"
          node "$GITHUB_WORKSPACE/dev/snapshot-install.mjs" "$target" > "$root/before.json"
          if RUST_INTEL_INSTALL_FAIL_AFTER=2 CLAUDE_CONFIG_DIR="$target" ./rust-cc-install.sh; then
            echo 'injected POSIX install failure was accepted' >&2; exit 1
          fi
          node "$GITHUB_WORKSPACE/dev/snapshot-install.mjs" "$target" > "$root/after.json"
          cmp "$root/before.json" "$root/after.json"
          CLAUDE_CONFIG_DIR="$target" ./rust-cc-install.sh
          node "$GITHUB_WORKSPACE/dev/snapshot-install.mjs" "$target" > "$root/installed.json"
          CLAUDE_CONFIG_DIR="$target" ./rust-cc-uninstall.sh
          test ! -e "$target/skills/rust-intel" && test ! -e "$target/commands/rust-intel-cc"
          for path in rust-cc-audit.md rust-cc-fix.md rust-cc-plan.md rust-audit.md rust-fix.md rust-plan.md rust-intel.md; do test ! -e "$target/commands/$path"; done
          test "$(cat "$target/commands/keep.md")" = unrelated
      - name: Smoke-test npm migration and rollback
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          target="$root/claude"
          mkdir -p "$target/commands/rust-intel-cc"
          for path in rust-cc-audit.md rust-cc-fix.md rust-cc-plan.md; do printf 'old\n' > "$target/commands/$path"; done
          printf 'old\n' > "$target/commands/rust-intel-cc/audit.md"
          for path in rust-audit.md rust-fix.md rust-plan.md rust-intel.md; do printf 'old\n' > "$target/commands/$path"; done
          printf 'keep\n' > "$target/commands/keep.md"
          CLAUDE_CONFIG_DIR="$target" node bin/install.js --user
          test ! -e "$target/commands/rust-intel-cc"
          for path in rust-audit.md rust-fix.md rust-plan.md rust-intel.md; do test ! -e "$target/commands/$path"; done
          test "$(cat "$target/commands/keep.md")" = keep
          node "$GITHUB_WORKSPACE/dev/snapshot-install.mjs" "$target" > "$root/known-good.json"
          if RUST_INTEL_INSTALL_FAIL_AFTER=2 CLAUDE_CONFIG_DIR="$target" node bin/install.js --user; then
            echo 'injected npm install failure was accepted' >&2; exit 1
          fi
          node "$GITHUB_WORKSPACE/dev/snapshot-install.mjs" "$target" > "$root/after.json"
          cmp "$root/known-good.json" "$root/after.json"
          CLAUDE_CONFIG_DIR="$target" node bin/install.js --user --uninstall
          test ! -e "$target/skills/rust-intel" && test ! -e "$target/commands/rust-intel-cc"
          for path in rust-cc-audit.md rust-cc-fix.md rust-cc-plan.md rust-audit.md rust-fix.md rust-plan.md rust-intel.md; do test ! -e "$target/commands/$path"; done
          test "$(cat "$target/commands/keep.md")" = keep
          mkdir -p "$root/dash-work"
          (cd "$root/dash-work" && CLAUDE_CONFIG_DIR=-dash-leading bash "$GITHUB_WORKSPACE/rust-cc-install.sh")
          test -f "$root/dash-work/-dash-leading/skills/rust-intel/SKILL.md"
      - name: Smoke-test Codex upgrade, rollback, and uninstall
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"; trap 'rm -rf "$root"' EXIT
          target="$root/codex-skills"; mkdir -p "$target/rust-intel" "$target/other"
          printf 'old-codex\n' > "$target/rust-intel/SKILL.md"
          printf 'keep\n' > "$target/other/sibling.md"
          node dev/snapshot-install.mjs "$target" > "$root/before.json"
          node bin/install-codex.js --user-dir "$target"
          node dev/snapshot-install.mjs "$target" > "$root/known-good.json"
          if RUST_INTEL_INSTALL_FAIL_AFTER=1 node bin/install-codex.js --user-dir "$target"; then echo 'injected Codex failure accepted' >&2; exit 1; fi
          node dev/snapshot-install.mjs "$target" > "$root/after.json"; cmp "$root/known-good.json" "$root/after.json"
          node bin/install-codex.js --user-dir "$target" --uninstall
          test ! -e "$target/rust-intel"; test "$(cat "$target/other/sibling.md")" = keep
      - name: Installer overlap-guard execution tests
        shell: bash
        run: |
          set -euo pipefail
          REPO="$(pwd)"
          fail() { echo "FAIL: $1" >&2; exit 1; }

          # 1. Normal install into a fresh, unrelated target succeeds and lands files.
          rm -rf /tmp/rci-normal
          CLAUDE_CONFIG_DIR=/tmp/rci-normal bash "$REPO/rust-cc-install.sh"
          [ -f /tmp/rci-normal/skills/rust-intel/SKILL.md ] || fail "normal install did not land SKILL.md"

          # 2. Destination is an EXISTING directory inside the source skill/ tree -> rejected.
          if CLAUDE_CONFIG_DIR="$REPO/skill" bash "$REPO/rust-cc-install.sh" 2>/tmp/rci-err; then
            fail "existing-target overlap was accepted"
          fi
          grep -q "must not overlap\|must not be inside" /tmp/rci-err || fail "existing-target overlap: wrong error"

          # 3. Destination is a FULLY MISSING path inside the source skill/ tree -> rejected.
          if CLAUDE_CONFIG_DIR="$REPO/skill/does-not-exist-yet" bash "$REPO/rust-cc-install.sh" 2>/tmp/rci-err; then
            fail "fully-missing-target overlap was accepted"
          fi
          grep -q "must not overlap\|must not be inside" /tmp/rci-err || fail "fully-missing-target overlap: wrong error"

          # 4. Missing component followed by `..` that lexically lands inside skill/ -> rejected.
          #    This is the exact bypass a non-normalizing canonical-path resolver lets through.
          if CLAUDE_CONFIG_DIR="$REPO/.rci-does-not-exist/../skill" bash "$REPO/rust-cc-install.sh" 2>/tmp/rci-err; then
            fail "missing-component-then-.. overlap bypass was accepted"
          fi
          grep -q "must not overlap\|must not be inside" /tmp/rci-err || fail "missing-component-then-.. overlap: wrong error"

          # 5. An existing symlink whose target resolves inside skill/ -> rejected (physical resolution).
          rm -rf /tmp/rci-symlink-target
          ln -s "$REPO/skill" /tmp/rci-symlink-target
          if CLAUDE_CONFIG_DIR=/tmp/rci-symlink-target bash "$REPO/rust-cc-install.sh" 2>/tmp/rci-err; then
            fail "symlink-into-source overlap was accepted"
          fi
          grep -q "must not overlap\|must not be inside" /tmp/rci-err || fail "symlink-into-source overlap: wrong error"

          # 6. COMPOSITION of 4 and 5: a missing component, then `..`, then an existing symlink
          #    into the source. Each ingredient is rejected alone (cases 4 and 5); composed, a
          #    resolver that normalizes only once returns the symlink UNRESOLVED, because the
          #    physical walk could not traverse through the nonexistent component and the lexical
          #    pass that removes it runs afterwards. Requires resolution to a fixpoint.
          rm -rf /tmp/rci-compose
          mkdir -p /tmp/rci-compose
          ln -s "$REPO/skill" /tmp/rci-compose/link
          if CLAUDE_CONFIG_DIR="/tmp/rci-compose/absent/../link" bash "$REPO/rust-cc-install.sh" 2>/tmp/rci-err; then
            fail "missing-component-then-..-then-symlink overlap bypass was accepted"
          fi
          grep -q "must not overlap\|must not be inside" /tmp/rci-err || fail "composed traversal+symlink overlap: wrong error"

          # 6b. Same composition aimed at the COMMANDS source tree, which has its own comparison.
          #     Here the skill guard passes (the destination is nowhere near skill/) and only the
          #     commands guard can catch it, so this exercises that second comparison specifically.
          rm -rf /tmp/rci-compose-cmd
          mkdir -p /tmp/rci-compose-cmd
          ln -s "$REPO/commands/rust-intel-cc" /tmp/rci-compose-cmd/link
          if CLAUDE_CONFIG_DIR="/tmp/rci-compose-cmd/absent/../link" bash "$REPO/rust-cc-install.sh" 2>/tmp/rci-err; then
            fail "composed traversal+symlink into commands source was accepted"
          fi
          grep -q "must not overlap\|must not be inside" /tmp/rci-err || fail "composed commands overlap: wrong error"

          rm -rf /tmp/rci-normal /tmp/rci-symlink-target /tmp/rci-compose /tmp/rci-compose-cmd /tmp/rci-err
          echo "installer overlap-guard execution tests passed"
      - name: Pack smoke test
        run: npm pack --dry-run
      - name: Verify a would-be release tag matches committed manifests
        run: node dev/check-release-version.mjs "$(node -p "require('./package.json').version")"
      - name: Smoke-test the npm installer on Node 24
        shell: bash
        run: |
          set -euo pipefail
          install_root="$(mktemp -d)"
          trap 'rm -rf "$install_root"' EXIT
          (
            cd "$install_root"
            node "$GITHUB_WORKSPACE/bin/install.js"
          )
          test -f "$install_root/.claude/skills/rust-intel/SKILL.md"
          for command_name in audit fix plan; do
            test -f "$install_root/.claude/commands/rust-cc-${command_name}.md"
          done

  windows-validator:
    name: windows validator (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 24.0.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run isolated validator coordinator
        run: node dev/validate-all.mjs

  installer-boundaries:
    name: ${{ matrix.surface }} installer boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        surface: [node-claude, node-codex, bash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Run the generated recovery matrix with checked inventories
        shell: bash
        env:
          SURFACE: ${{ matrix.surface }}
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/dev/test-installer-recovery.mjs"
          read_inventory() {
            local output="$1"
            local parsed="${output}.parsed"
            shift
            if ! "$@" >"$output"; then
              echo 'boundary inventory producer failed' >&2
              return 1
            fi
            if ! awk '{ line = $0; sub(/^[[:space:]]+/, "", line); sub(/[[:space:]]+$/, "", line); if (length(line) > 0) print line }' "$output" >"$parsed"; then
              echo 'boundary inventory parser failed' >&2
              rm -f "$parsed"
              return 1
            fi
            if [[ ! -s "$parsed" ]]; then
              echo 'boundary inventory has no nonblank records' >&2
              rm -f "$parsed"
              return 1
            fi
            mv "$parsed" "$output"
          }
          negative_inventory="$(mktemp)"
          blank_inventory=''
          inventory=''
          cleanup_inventories() {
            rm -f "$negative_inventory"
            [[ -z "$blank_inventory" ]] || rm -f "$blank_inventory"
            [[ -z "$inventory" ]] || rm -f "$inventory"
          }
          trap cleanup_inventories EXIT
          if read_inventory "$negative_inventory" bash -c 'exit 7'; then
            echo 'negative inventory producer unexpectedly succeeded' >&2
            exit 1
          fi
          blank_inventory="$(mktemp)"
          if read_inventory "$blank_inventory" bash -c 'printf " \n\t\n"'; then
            echo 'blank inventory producer unexpectedly succeeded' >&2
            exit 1
          fi
          rm -f "$blank_inventory"
          blank_inventory=''
          for operation in install uninstall; do
            for mode in fresh upgrade sparse; do
              [[ "$operation" == uninstall && "$mode" == fresh ]] && continue
              inventory="$(mktemp)"
              read_inventory "$inventory" node "$helper" --list "$SURFACE" "$operation" "$mode"
              while IFS= read -r boundary; do
                node "$helper" "$SURFACE" "$operation" "$mode" "$boundary"
                node "$helper" "$SURFACE" "$operation" "$mode" "$boundary" cross
              done < "$inventory"
              rm -f "$inventory"
              inventory=''
            done
          done

  node-floor:
    name: Node.js 24.0.0 floor
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.0.0
      - name: Validate at the supported Node floor
        run: npm run validate
      - name: Smoke-test the npm installer at the supported Node floor
        shell: bash
        run: |
          set -euo pipefail
          install_root="$(mktemp -d)"
          trap 'rm -rf "$install_root"' EXIT
          (
            cd "$install_root"
            node "$GITHUB_WORKSPACE/bin/install.js"
          )
          test -f "$install_root/.claude/skills/rust-intel/SKILL.md"
          for command_name in audit fix plan; do
            test -f "$install_root/.claude/commands/rust-cc-${command_name}.md"
          done

  windows-install-smoke:
    name: Windows installer and recovery (${{ matrix.powershell }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Keep PowerShell 7 coverage, and exercise the powershell.exe runtime used by the
        # documented .bat wrappers (Windows PowerShell 5.1 on stock supported hosts).
        powershell: [pwsh, powershell.exe]
    env:
      RUST_INTEL_POWERSHELL_EXECUTABLE: ${{ matrix.powershell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Smoke-test PowerShell transactions, literal source paths, and uninstall
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rust-intel install [literal]'
          $source = Join-Path $root 'source [brackets]'
          $target = Join-Path $root 'target [brackets]'
          Copy-Item -LiteralPath $env:GITHUB_WORKSPACE -Destination $source -Recurse
          $script = Join-Path $source 'rust-cc-install.ps1'
          $uninstall = Join-Path $source 'rust-cc-uninstall.ps1'
          $installBat = Join-Path $source 'rust-cc-install.bat'
          $uninstallBat = Join-Path $source 'rust-cc-uninstall.bat'
          $powershell = $env:RUST_INTEL_POWERSHELL_EXECUTABLE
          $env:CLAUDE_CONFIG_DIR = $target
          New-Item -ItemType Directory -Force -Path (Join-Path $target 'skills\rust-intel'), (Join-Path $target 'commands\rust-intel-cc') | Out-Null
          Set-Content -LiteralPath (Join-Path $target 'skills\rust-intel\SKILL.md') -Value 'old-skill'
          foreach ($name in 'rust-cc-audit.md','rust-cc-fix.md','rust-cc-plan.md') { Set-Content -LiteralPath (Join-Path $target "commands\$name") -Value "old-$name" }
          Set-Content -LiteralPath (Join-Path $target 'commands\rust-intel-cc\audit.md') -Value 'old-namespace'
          foreach ($name in 'rust-audit.md','rust-fix.md','rust-plan.md','rust-intel.md') { Set-Content -LiteralPath (Join-Path $target "commands\$name") -Value "old-$name" }
          Set-Content -LiteralPath (Join-Path $target 'commands\keep.md') -Value 'unrelated'
          $before = (& node (Join-Path $source 'dev\snapshot-install.mjs') $target | Out-String)
          $failed = $false
          $env:RUST_INTEL_INSTALL_FAIL_AFTER = '2'
          try { & $script } catch { $failed = $true }
          if (-not $failed) { throw 'injected PowerShell backup failure was accepted' }
          $after = (& node (Join-Path $source 'dev\snapshot-install.mjs') $target | Out-String)
          if ($before -ne $after) { throw 'PowerShell backup failure changed the complete inventory' }
          Remove-Item Env:RUST_INTEL_INSTALL_FAIL_AFTER
          # The .bat wrappers are part of the documented Windows surface and always dispatch to
          # powershell.exe; use them for the successful install/uninstall path as well as testing
          # the underlying scripts directly for injected failures and restart boundaries.
          & $installBat
          if ($LASTEXITCODE -ne 0) { throw "install .bat dispatch failed with exit code $LASTEXITCODE" }
          $knownGood = (& node (Join-Path $source 'dev\snapshot-install.mjs') $target | Out-String)
          $env:RUST_INTEL_INSTALL_ABORT_AT = 'after-backup-journal-0'
          # Start-Process passes the calling session's PSModulePath to the child verbatim (and
          # re-adds a pwsh-flavored path even when the variable is cleared), so a powershell.exe
          # child resolves Microsoft.PowerShell.Utility to the Core-only PowerShell 7 copy and
          # cannot autoload Get-FileHash. Pin the child-visible value to the Windows PowerShell
          # machine default for the duration of the call; a pwsh child prepends its own edition's
          # directories ahead of it, so both matrix runtimes resolve their inbox modules.
          $savedModulePath = $env:PSModulePath
          try {
            $env:PSModulePath = "$env:ProgramFiles\WindowsPowerShell\Modules;$env:windir\System32\WindowsPowerShell\v1.0\Modules"
            $abrupt = Start-Process -FilePath $powershell -ArgumentList @('-NoProfile', '-File', "`"$script`"") -Wait -PassThru -NoNewWindow
          } finally { $env:PSModulePath = $savedModulePath }
          if ($abrupt.ExitCode -ne 86) { throw "abrupt PowerShell install exit code was $($abrupt.ExitCode)" }
          Remove-Item Env:RUST_INTEL_INSTALL_ABORT_AT
          & $script
          $after = (& node (Join-Path $source 'dev\snapshot-install.mjs') $target | Out-String)
          if ($knownGood -ne $after) { throw 'PowerShell abrupt install restart changed the complete inventory' }
          $lock = [IO.File]::Open((Join-Path $target 'commands\rust-cc-audit.md'), [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::None)
          try {
            $failed = $false
            try { & $script } catch { $failed = $true }
            if (-not $failed) { throw 'locked PowerShell backup was accepted' }
          } finally { $lock.Dispose() }
          $after = (& node (Join-Path $source 'dev\snapshot-install.mjs') $target | Out-String)
          if ($knownGood -ne $after) { throw 'PowerShell locked-backup rollback changed the complete inventory' }
          $env:RUST_INTEL_INSTALL_FAIL_AFTER = '2'
          $failed = $false
          try { & $uninstall } catch { $failed = $true }
          if (-not $failed) { throw 'injected PowerShell uninstall failure was accepted' }
          $after = (& node (Join-Path $source 'dev\snapshot-install.mjs') $target | Out-String)
          if ($knownGood -ne $after) { throw 'PowerShell uninstall rollback changed the complete inventory' }
          Remove-Item Env:RUST_INTEL_INSTALL_FAIL_AFTER
          $env:RUST_INTEL_INSTALL_ABORT_AT = 'after-backup-journal-0'
          $savedModulePath = $env:PSModulePath
          try {
            $env:PSModulePath = "$env:ProgramFiles\WindowsPowerShell\Modules;$env:windir\System32\WindowsPowerShell\v1.0\Modules"
            $abrupt = Start-Process -FilePath $powershell -ArgumentList @('-NoProfile', '-File', "`"$uninstall`"") -Wait -PassThru -NoNewWindow
          } finally { $env:PSModulePath = $savedModulePath }
          if ($abrupt.ExitCode -ne 86) { throw "abrupt PowerShell uninstall exit code was $($abrupt.ExitCode)" }
          Remove-Item Env:RUST_INTEL_INSTALL_ABORT_AT
          & $uninstallBat
          if ($LASTEXITCODE -ne 0) { throw "uninstall .bat dispatch failed with exit code $LASTEXITCODE" }
          if (Test-Path -LiteralPath (Join-Path $target 'skills\rust-intel')) { throw 'PowerShell uninstall left skill files' }
          if (-not (Test-Path -LiteralPath (Join-Path $target 'commands\keep.md'))) { throw 'PowerShell uninstall removed unrelated sibling' }
      - name: Exhaustively test PowerShell transaction boundaries (${{ matrix.powershell }})
        shell: pwsh
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE 'dev\test-installer-recovery.mjs'
          function Invoke-RecoveryCase([string]$operation, [string]$mode, [string]$boundary, [switch]$Cross) {
            $arguments = @($helper, 'powershell', $operation, $mode, $boundary)
            if ($Cross) { $arguments += 'cross' }
            & node $arguments
            if ($LASTEXITCODE -ne 0) { throw "PowerShell $operation $mode $boundary recovery case failed with exit $LASTEXITCODE" }
          }
          foreach ($operation in 'install','uninstall') {
            foreach ($mode in 'fresh','upgrade','sparse') {
              if ($operation -eq 'uninstall' -and $mode -eq 'fresh') { continue }
              $boundaries = @(& node $helper '--list' 'powershell' $operation $mode)
              if ($LASTEXITCODE -ne 0) { throw "PowerShell $operation $mode inventory generation failed" }
              if ($boundaries.Count -eq 0 -or ($boundaries | Where-Object { $_.Trim() }).Count -eq 0) { throw "PowerShell $operation $mode inventory was empty" }
              foreach ($boundary in $boundaries) {
                if ($boundary.Trim()) {
                  Invoke-RecoveryCase $operation $mode $boundary.Trim()
                  Invoke-RecoveryCase $operation $mode $boundary.Trim() -Cross
                }
              }
            }
          }

  bash-floor:
    name: Bash 3.2 installer floor
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify and execute the oldest advertised Bash
        shell: bash
        run: |
          set -euo pipefail
          case "${BASH_VERSION:-}" in 3.2.*) ;; *) echo "expected Bash 3.2, got ${BASH_VERSION:-unknown}" >&2; exit 1 ;; esac
          read_inventory() {
            local output="$1"
            local parsed="${output}.parsed"
            shift
            if ! "$@" >"$output"; then
              echo 'boundary inventory producer failed' >&2
              return 1
            fi
            if ! awk '{ line = $0; sub(/^[[:space:]]+/, "", line); sub(/[[:space:]]+$/, "", line); if (length(line) > 0) print line }' "$output" >"$parsed"; then
              echo 'boundary inventory parser failed' >&2
              rm -f "$parsed"
              return 1
            fi
            if [ ! -s "$parsed" ]; then
              echo 'boundary inventory has no nonblank records' >&2
              rm -f "$parsed"
              return 1
            fi
            mv "$parsed" "$output"
          }
          bash -n rust-cc-install.sh rust-cc-uninstall.sh
          root="$(mktemp -d)"
          negative_inventory=''
          blank_inventory=''
          inventory=''
          cleanup_bash_floor() {
            rm -rf "$root"
            [[ -z "$negative_inventory" ]] || rm -f "$negative_inventory"
            [[ -z "$blank_inventory" ]] || rm -f "$blank_inventory"
            [[ -z "$inventory" ]] || rm -f "$inventory"
          }
          trap cleanup_bash_floor EXIT
          negative_inventory="$(mktemp)"
          blank_inventory="$(mktemp)"
          if read_inventory "$negative_inventory" bash -c 'exit 7'; then
            echo 'negative inventory producer unexpectedly succeeded' >&2; exit 1
          fi
          if read_inventory "$blank_inventory" bash -c 'printf " \n\t\n"'; then
            echo 'blank inventory producer unexpectedly succeeded' >&2; exit 1
          fi
          rm -f "$negative_inventory" "$blank_inventory"
          target="$root/-target with spaces"
          mkdir -p "$target/skills/rust-intel" "$target/commands"
          printf 'old-skill\n' > "$target/skills/rust-intel/SKILL.md"
          printf 'unrelated\n' > "$target/commands/keep.md"
          node dev/snapshot-install.mjs "$target" > "$root/before.json"
          if RUST_INTEL_INSTALL_FAIL_AFTER=1 CLAUDE_CONFIG_DIR="$target" ./rust-cc-install.sh; then
            echo 'injected Bash 3.2 rollback failure was accepted' >&2; exit 1
          fi
          node dev/snapshot-install.mjs "$target" > "$root/after.json"
          cmp "$root/before.json" "$root/after.json"
          CLAUDE_CONFIG_DIR="$target" ./rust-cc-install.sh
          node dev/snapshot-install.mjs "$target" > "$root/installed.json"
          CLAUDE_CONFIG_DIR="$target" ./rust-cc-uninstall.sh
          test ! -e "$target/skills/rust-intel"
          test "$(cat "$target/commands/keep.md")" = unrelated
          # Exercise the generated recovery matrix under the oldest advertised shell, including
          # both directions of cross-operation recovery. Each list is materialized so a failed
          # producer cannot masquerade as an empty passing matrix.
          for operation in install uninstall; do
            for mode in fresh upgrade sparse; do
              [[ "$operation" == uninstall && "$mode" == fresh ]] && continue
              inventory="$(mktemp)"
              read_inventory "$inventory" node dev/test-installer-recovery.mjs --list bash "$operation" "$mode"
              while IFS= read -r boundary; do
                node dev/test-installer-recovery.mjs bash "$operation" "$mode" "$boundary"
                node dev/test-installer-recovery.mjs bash "$operation" "$mode" "$boundary" cross
              done < "$inventory"
              rm -f "$inventory"
              inventory=''
            done
          done
