# Publish stable GitHub Releases via npm Trusted Publishing.
# Binding: PHPCraftdream/rust-intel, npm-publish.yml, no environment.
# Commit all three manifest versions before tagging; never rewrite the tagged tree.

name: npm-publish

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read
  id-token: write

# Serialize retries for the same release.
concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: ${{ github.repository == 'PHPCraftdream/rust-intel' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release metadata and npm OIDC support
        run: |
          node --input-type=module - "$RELEASE_TAG" "$(npm --version)" <<'NODE'
          import { isValidSemver } from './dev/semver.mjs';
          const [tag, npmVersion] = process.argv.slice(2);
          const version = tag.slice(1);
          if (!tag.startsWith('v') || !isValidSemver(version) || /[-+]/.test(version)) {
            throw new Error('Stable releases require a vMAJOR.MINOR.PATCH tag.');
          }
          const parts = npmVersion.split('.').map(Number);
          if (!isValidSemver(npmVersion) || !parts.every(Number.isSafeInteger)
            || parts[0] < 11 || (parts[0] === 11 && (parts[1] < 5 || (parts[1] === 5 && parts[2] < 1)))) {
            throw new Error('npm Trusted Publishing requires npm >=11.5.1.');
          }
          console.log(`Release ${tag}; npm ${npmVersion} supports Trusted Publishing.`);
          NODE
          node dev/check-release-version.mjs "${RELEASE_TAG#v}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PASSED_RUNS="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f status=success -f per_page=1 --jq '.total_count')"
          if ! [[ "$PASSED_RUNS" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::The release commit needs a successful validate workflow. Finish CI, then re-run this release workflow.'
            exit 1
          fi

      - name: Sanity checks
        run: |
          node --check bin/install.js
          node --check bin/install-codex.js
          node --check bin/install-transaction.js
          node --check dev/set-release-version.mjs
          node --check dev/check-release-version.mjs
          node --check dev/sync-mirror.mjs
          node --check skill/audit-project.workflow.js
          test -f skill/SKILL.md
          test -f skill/references/sources.md
          test -f .codex-plugin/plugin.json
          test -f commands/rust-intel-cc/audit.md
          node dev/validate-all.mjs

      - name: Smoke-test the installer
        run: |
          mkdir -p /tmp/claude-sandbox
          CLAUDE_CONFIG_DIR=/tmp/claude-sandbox node bin/install.js --user
          test -f /tmp/claude-sandbox/skills/rust-intel/SKILL.md
          test -f /tmp/claude-sandbox/skills/rust-intel/audit-project.workflow.js
          test -f /tmp/claude-sandbox/skills/rust-intel/references/sources.md
          test -f /tmp/claude-sandbox/commands/rust-cc-audit.md

      - name: Smoke-test the Codex installer
        run: |
          mkdir -p /tmp/codex-sandbox
          node bin/install-codex.js --user-dir /tmp/codex-sandbox
          test -f /tmp/codex-sandbox/rust-intel/SKILL.md
          test -f /tmp/codex-sandbox/rust-intel/references/sources.md

      - name: Publish
        # Skip a duplicate only when registry and local tarball integrity agree.
        run: |
          PKG_VERSION="${RELEASE_TAG#v}"
          if npm view "rust-intel-cc@$PKG_VERSION" version >/dev/null 2>&1; then
            REGISTRY_INTEGRITY="$(npm view "rust-intel-cc@$PKG_VERSION" dist.integrity)"
            LOCAL_INTEGRITY="$(npm pack --dry-run --json | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>console.log(JSON.parse(d)[0].integrity))')"
            if [ "$REGISTRY_INTEGRITY" = "$LOCAL_INTEGRITY" ]; then
              echo "rust-intel-cc@$PKG_VERSION already on the registry and matches the local tarball (duplicate run for this tag) — skipping."
              exit 0
            fi
            echo "::error::rust-intel-cc@$PKG_VERSION is on the registry but its integrity does NOT match the local build for this tag."
            echo "registry: $REGISTRY_INTEGRITY"
            echo "local:    $LOCAL_INTEGRITY"
            exit 1
          fi
          npm publish --provenance --access public
