# Publish rust-intel-cc to npm on every version tag (v*).
# The package version is derived from the tag — package.json's version field
# is informational and gets overwritten at publish time, so tagging is the
# single release trigger and the two can never drift.
#
# Requires the NPM_TOKEN repository secret (npm Granular Access Token with
# read/write on the package, or a classic Automation token):
#   gh secret set NPM_TOKEN --repo PHPCraftdream/rust-intel

name: npm-publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Sanity checks
        run: |
          node --check bin/install.js
          node --check bin/install-codex.js
          node --check skill/audit-project.workflow.js
          test -f skill/SKILL.md
          test -f skill/references/sources.md
          test -f .codex-plugin/plugin.json
          test -f commands/rust-intel-cc/audit.md
          node dev/validate.mjs

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Smoke-test the installer
        run: |
          mkdir -p /tmp/claude-sandbox
          CLAUDE_CONFIG_DIR=/tmp/claude-sandbox node bin/install.js --user
          test -f /tmp/claude-sandbox/skills/rust-intel/SKILL.md
          test -f /tmp/claude-sandbox/skills/rust-intel/audit-project.workflow.js
          test -f /tmp/claude-sandbox/skills/rust-intel/references/sources.md
          test -f /tmp/claude-sandbox/commands/rust-cc-audit.md

      - name: Smoke-test the Codex installer
        run: |
          mkdir -p /tmp/codex-sandbox
          node bin/install-codex.js --user-dir /tmp/codex-sandbox
          test -f /tmp/codex-sandbox/rust-intel/SKILL.md
          test -f /tmp/codex-sandbox/rust-intel/references/sources.md

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
