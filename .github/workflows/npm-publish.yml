# Publish rust-intel-cc to npm on every version tag (v*).
#
# The tag is the release trigger, but it does NOT set the version: a git tag is immutable and
# points at a specific tree, so rewriting manifests in the runner's checkout after the tag exists
# would publish a version the tagged tree itself never had. Instead: bump package.json,
# .claude-plugin/plugin.json, and .codex-plugin/plugin.json locally with
# `node dev/set-release-version.mjs <version>`, commit that, THEN tag `v<version>`. This workflow
# only VERIFIES the tag matches what was committed (dev/check-release-version.mjs) and fails the
# release otherwise — see that script's header for why verify-not-rewrite is the correct model.
#
# Requires the NPM_TOKEN repository secret (npm Granular Access Token with
# read/write on the package, or a classic Automation token):
#   gh secret set NPM_TOKEN --repo PHPCraftdream/rust-intel

name: npm-publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm --provenance

# A tag push has occasionally been observed firing this workflow twice for the same ref (both
# runs targeting the same immutable tag). Serialize same-tag runs instead of racing them — a
# concurrent second `npm publish` for a version the first run just published is not a new
# problem, but running it in parallel rather than after is what turned it into a failed run.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches committed manifests
        run: node dev/check-release-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Sanity checks
        run: |
          node --check bin/install.js
          node --check bin/install-codex.js
          node --check dev/set-release-version.mjs
          node --check dev/check-release-version.mjs
          node --check dev/sync-mirror.mjs
          node --check skill/audit-project.workflow.js
          test -f skill/SKILL.md
          test -f skill/references/sources.md
          test -f .codex-plugin/plugin.json
          test -f commands/rust-intel-cc/audit.md
          node dev/validate.mjs

      - name: Smoke-test the installer
        run: |
          mkdir -p /tmp/claude-sandbox
          CLAUDE_CONFIG_DIR=/tmp/claude-sandbox node bin/install.js --user
          test -f /tmp/claude-sandbox/skills/rust-intel/SKILL.md
          test -f /tmp/claude-sandbox/skills/rust-intel/audit-project.workflow.js
          test -f /tmp/claude-sandbox/skills/rust-intel/references/sources.md
          test -f /tmp/claude-sandbox/commands/rust-cc-audit.md

      - name: Smoke-test the Codex installer
        run: |
          mkdir -p /tmp/codex-sandbox
          node bin/install-codex.js --user-dir /tmp/codex-sandbox
          test -f /tmp/codex-sandbox/rust-intel/SKILL.md
          test -f /tmp/codex-sandbox/rust-intel/references/sources.md

      - name: Publish
        # Idempotent: a queued duplicate run (see the concurrency group above) reaches this step
        # after the first run already published the same tag's version. That is a no-op, not a
        # failure — BUT "a package with this version exists" is not proof it is the SAME package:
        # this repo does not have GitHub immutable releases / tag protection enabled, so a tag is
        # technically movable. Don't take "version exists" on faith — compare the local tarball's
        # integrity hash against what the registry actually has, and fail loudly on a mismatch
        # instead of silently treating a different artifact as this run's own duplicate.
        run: |
          PKG_VERSION="${GITHUB_REF_NAME#v}"
          if npm view "rust-intel-cc@$PKG_VERSION" version >/dev/null 2>&1; then
            REGISTRY_INTEGRITY="$(npm view "rust-intel-cc@$PKG_VERSION" dist.integrity)"
            LOCAL_INTEGRITY="$(npm pack --dry-run --json | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>console.log(JSON.parse(d)[0].integrity))')"
            if [ "$REGISTRY_INTEGRITY" = "$LOCAL_INTEGRITY" ]; then
              echo "rust-intel-cc@$PKG_VERSION already on the registry and matches the local tarball (duplicate run for this tag) — skipping."
              exit 0
            fi
            echo "::error::rust-intel-cc@$PKG_VERSION is on the registry but its integrity does NOT match the local build for this tag."
            echo "registry: $REGISTRY_INTEGRITY"
            echo "local:    $LOCAL_INTEGRITY"
            exit 1
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
